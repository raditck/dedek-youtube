# dedek-youtube daily sync (yt-dlp -> Combined)
name: sync

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      max_per_channel:
        description: 'Max videos per channel (0 = all)'
        default: '0'

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install yt-dlp google-api-python-client google-auth
      - name: Discover channels + write Combined
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MAX_PER_CHANNEL: ${{ github.event.inputs.max_per_channel || '0' }}
        run: python tools/sync.py